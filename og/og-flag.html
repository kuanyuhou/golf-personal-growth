<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>OG image source</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #174d33; color: #fff;
    font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif;
    position: relative;
  }
  .ring { position: absolute; border-radius: 50%; border: 2px solid rgba(242,193,78,.18); }
  .r1 { width: 760px; height: 760px; right: -260px; top: -120px; }
  .r2 { width: 520px; height: 520px; right: -140px; top: 0; }
  .green { position: absolute; left: 0; right: 0; bottom: 0; height: 92px; background: #1f7a4d; }
  .wrap { position: absolute; left: 80px; top: 128px; right: 80px; }
  .kicker { font-size: 26px; color: #bfe3cc; letter-spacing: 6px; margin: 0 0 6px; }
  h1 { font-size: 80px; line-height: 1.2; margin: 0 0 18px; letter-spacing: 2px; font-weight: 700; white-space: nowrap; }
  .bar { width: 96px; height: 6px; border-radius: 3px; background: #f2c14e; margin: 0 0 22px; }
  .tag { font-size: 32px; color: #f2c14e; margin: 0 0 34px; font-weight: 700; }
  .pills { display: flex; gap: 14px; flex-wrap: wrap; }
  .pill { font-size: 26px; padding: 8px 22px; border-radius: 999px; background: rgba(255,255,255,.12); }
  .pill.star { background: #f2c14e; color: #3a2a00; font-weight: 700; }
  .url { position: absolute; left: 80px; bottom: 26px; font-size: 26px; color: #e3f2e9; letter-spacing: .5px; }
  .big { position: absolute; right: 80px; top: 119px; width: 300px; height: 300px; }
</style>
</head>
<body>
  <div class="ring r1"></div><div class="ring r2"></div>
  <div class="green"></div>
  <svg class="big" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#1f7a4d" stroke="#f2c14e" stroke-width="1.2"/><ellipse cx="32" cy="49" rx="17" ry="5" fill="#bfe3cc"/><rect x="24" y="10" width="4" height="39" rx="1.5" fill="#fff"/><path d="M28 10l20 7-20 7z" fill="#f2c14e"/><circle cx="42" cy="46" r="5" fill="#fff"/></svg>
  <div class="wrap">
    <p class="kicker">GOLF &amp; PERSONAL GROWTH</p>
    <h1>高爾夫與個人成長</h1>
    <div class="bar"></div>
    <p class="tag">從一顆小白球，練習誠實、專注與堅持</p>
    <div class="pills">
      <span class="pill star">★ 品格培養</span>
      <span class="pill">心理訓練</span>
      <span class="pill">禮儀與規則</span>
      <span class="pill">2026 賽事</span>
    </div>
  </div>
  <div class="url">kuanyuhou.github.io/golf-personal-growth</div>
</body>
</html>
